[loggers]
keys=root

[handlers]
keys=console, logfile

[formatters]
keys=logfileformatter

[logger_root]
level=INFO
handlers=console, logfile

[formatter_logfileformatter]
format=%(asctime)s - %(levelname)s - %(message)s

[handler_logfile]
class=handlers.RotatingFileHandler
level=INFO
args=('agent.log','a')
formatter=logfileformatter

[handler_console]
class=StreamHandler
level=INFO
args=(sys.stdout,)
formatter=logfileformatter